# ── Android ────────────────────────────────────────────
android.useAndroidX=true
android.enableJetifier=false
android.nonTransitiveRClass=true

# ── Gradle daemon & caching ────────────────────────────
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true
org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=512m -XX:+UseParallelGC -Dfile.encoding=UTF-8

# ── Kotlin ─────────────────────────────────────────────
kotlin.code.style=official
kotlin.daemon.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=384m

# ── Browser 独立版本 (single source of truth, 与 mengpaw-browser/build.gradle.kts 同步) ──
mengpaw.browser.version=0.9.0

# ── 依赖的共享地基版本 (主仓库 kernel tag, JitPack 构件) ──
mengpaw.foundation.version=0.44.0
